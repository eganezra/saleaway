name: deploy

# A push to main runs the checks (ci.yml) and then, only when the repository variable DEPLOY_ENABLED is the text `true`, deploys:
# the database migrations first, then the web app, then (never between 02:50 and 03:50 UTC, when the nightly run is on) the
# pipeline. Without the variable a push runs the checks and stops. A manual run (workflow_dispatch) deploys only from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never stop one half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # The quiet-window wait can last up to an hour, so the job limit is well above it; every step has its own limit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: pnpm/action-setup@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Apply new database migrations
        run: pnpm db:migrate:remote
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the web app
        run: pnpm deploy:web
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wait out the nightly run (02:50 to 03:50 UTC)
        run: pnpm ci:wait-for-quiet-window
        timeout-minutes: 65
      - name: Deploy the pipeline
        run: pnpm deploy:pipeline
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
